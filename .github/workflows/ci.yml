name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://shubham:ok@localhost:5432/fitswap_test
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shubham
          POSTGRES_PASSWORD: ok
          POSTGRES_DB: fitswap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shubham -d fitswap_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to test database
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

  docker:
    name: Build Docker images
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests build both images, but do not receive registry credentials.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build client image
        uses: docker/build-push-action@v7
        with:
          context: ./Client
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ github.event_name == 'push' && format('{0}/fitswap-frontend:latest,{0}/fitswap-frontend:{1}', vars.DOCKER_USERNAME, github.sha) || 'fitswap-frontend:ci' }}

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: ./Server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ github.event_name == 'push' && format('{0}/fitswap-backend:latest,{0}/fitswap-backend:{1}', vars.DOCKER_USERNAME, github.sha) || 'fitswap-backend:ci' }}
