[build]
  command = "npm install --include=optional --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.14.0"
  NPM_FLAGS = "--include=optional"

[[redirects]]
  from = "/api/*"
  to = "https://fit-swap-1.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https://images.unsplash.com https://*.amazonaws.com; script-src 'self' https://accounts.google.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.onrender.com https://accounts.google.com https://checkout.razorpay.com; frame-src https://accounts.google.com https://checkout.razorpay.com https://www.openstreetmap.org; upgrade-insecure-requests"
